<!doctype html>
<html lang="en" translate="no" background="#000000">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>DuuniExpo Passi</title>
  </head>
  <body style="background: #000000;">
    <div id="app"></div>

      <noscript>
        <div style="position: absolute; top:0px; left:0px;width:100vw;width:100svw;height:100vh;height:100svh;display: flex;flex-direction: column;justify-content: center;align-items:center;height: 100vh; height: 100svh;">
          <div style="flex: 1 1;display: flex;flex-direction: column; justify-content: center;align-items: center;">
              <h1 style="font-size:1.6em">DuuniExpo Passi tarvitsee Javascript-tuen selaimessasi.</h1>
              <p>Tapaa Duuni-Dudu ja upeat näytteilleasettajat.</p>      
          </div>
          <div style="flex: 1 1;display: flex;flex-direction: column; justify-content: center;align-items: center;">
            <h1 style="font-size:1.6em;">Enable Javascript to access DuuniExpo Passi.</h1>
            <p style="">Meet Duuni-Dudu and all the amazing exhibitors.</p>
          </div>
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
    <!-- disable service worker -->
    <script>
      if(navigator && navigator.serviceWorker)
      {
        navigator.serviceWorker.getRegistrations().then(function(registrations) { 
          for(let registration of registrations) { 
            registration.unregister(); 
          } 
        });
      }
    </script>
  </body>
</html>
